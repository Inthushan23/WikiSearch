[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-serv"
version = "0.1.0"
description = "MCP service and LangGraph agent utilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "nltk>=3.8.0",
    "qdrant-client>=1.12.0",
    "requests>=2.31.0",
    "sentence-transformers>=3.0.0",
    "unidecode>=1.3.0",
    "uvicorn[standard]>=0.30.0",
    "wikipedia-api>=0.14.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["app", "config"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
